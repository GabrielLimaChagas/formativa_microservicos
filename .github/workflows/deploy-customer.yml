name: Deploy Customer Service

on:
  push:
    branches:
      - main
    paths:
      - 'customer-service/**'
      - '.github/workflows/deploy-customer.yml'
  workflow_dispatch:

concurrency:
  group: azure-b1-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r customer-service/requirements.txt
          pip install pytest pytest-archon typeguard

      - name: Run Pytest
        env:
          AZURE_SQL_CONNECTION_STRING: ''
          AZURE_SERVICEBUS_CONNECTION_STRING: ''
        run: |
          cd customer-service
          python -m pytest

  deploy:
    name: Deploy Customer Service
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: formativa-customer-service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CUSTOMER }}
          package: ./customer-service
