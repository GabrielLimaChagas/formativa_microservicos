name: Backend Microservices CI/CD (Azure App Service)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests & Architecture Fitness Functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run Architecture Fitness Functions
        run: |
          python -m pytest tests/architecture/ -v
          python -m pytest tests/test_backend_architecture.py -v

      - name: Run Customer Service Unit Tests
        run: |
          python -m pytest customer-service/tests/ -v

      - name: Run Product Service Unit Tests
        run: |
          python -m pytest product-service/tests/ -v

  deploy-customer-service:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    name: Deploy Customer Service
    steps:
      - uses: actions/checkout@v4
      - name: Package Customer Service
        run: |
          cd customer-service
          zip -r ../customer-service.zip . -x "__pycache__/*" -x "tests/*" -x "*.db"
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'formativa-customer-service'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CUSTOMER }}
          package: customer-service.zip

  deploy-product-service:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    name: Deploy Product Service
    steps:
      - uses: actions/checkout@v4
      - name: Package Product Service
        run: |
          cd product-service
          zip -r ../product-service.zip . -x "__pycache__/*" -x "tests/*" -x "*.db"
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'formativa-product-service'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCT }}
          package: product-service.zip
