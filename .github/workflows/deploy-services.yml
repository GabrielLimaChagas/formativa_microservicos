name: Deploy Microservices to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - 'customer-service/**'
      - 'product-service/**'
  workflow_dispatch:

# Impede deploys simultâneos para evitar 409 Conflict no Kudu/OneDeploy
concurrency:
  group: azure-appservice-deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. API Gateway / BFF
  # -------------------------------------------------------------
  deploy-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: formativa-api-gateway
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_GATEWAY }}
          package: ./api-gateway

  # -------------------------------------------------------------
  # 2. Customer Service (executa após o Gateway para evitar pico de CPU na B1)
  # -------------------------------------------------------------
  deploy-customer:
    name: Deploy Customer Service
    runs-on: ubuntu-latest
    needs: deploy-gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: formativa-customer-service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CUSTOMER }}
          package: ./customer-service

  # -------------------------------------------------------------
  # 3. Product Service (executa após o Customer Service para evitar sobrecarga)
  # -------------------------------------------------------------
  deploy-product:
    name: Deploy Product Service
    runs-on: ubuntu-latest
    needs: deploy-customer
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: formativa-product-service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCT }}
          package: ./product-service
